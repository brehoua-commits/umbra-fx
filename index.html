<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbra-FX Mobile</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 30px;
        }
        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #aaa;
        }
        input[type="file"], select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #e0e0e0;
            color: #121212;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            background: #fff;
        }
        #preview {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 15px;
            display: none;
            border-radius: 4px;
            border: 1px dashed #444;
        }
    </style>
</head>
<body>

    <h1>UMBRA-FX</h1>
    <div class="subtitle">Dark Expressionist Asset Processor</div>

    <div class="card">
        <label for="imageInput">Sélectionner une image :</label>
        <input type="file" id="imageInput" accept="image/*">

        <label for="modeSelect">Mode esthétique :</label>
        <select id="modeSelect">
            <option value="charcoal">Charcoal Minimal (Fusain)</option>
            <option value="deep-shadow">Deep Shadow (Ombres profondes)</option>
            <option value="melancholy">Melancholic Dream (Atmosphère onirique)</option>
        </select>

        <button onclick="processImage()">Appliquer l'effet</button>

        <img id="preview" alt="Aperçu du résultat">
    </div>

    <script>
        function processImage() {
            const input = document.getElementById('imageInput');
            const preview = document.getElementById('preview');
            const mode = document.getElementById('modeSelect').value;

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    alert(`Effet "${mode}" appliqué avec succès (Simulation mobile) !`);
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                alert("Veuillez d'abord sélectionner une image.");
            }
        }
    </script>

</body>
</html>
